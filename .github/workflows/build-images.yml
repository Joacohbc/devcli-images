name: "Build and Publish Custom Devcontainer Images"

on:
  push:
    branches: [ "main" ]
    paths:
      - 'profiles/**'
      - '.github/workflows/build-images.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'profiles/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
    inputs:
      profile_filter:
        description: "Profile ID / directory name to build (or 'all' for every profile)"
        required: false
        default: "all"
      cli_version:
        description: "devcontainer-cli version to download (e.g. latest, v1.18.1)"
        required: false
        default: "latest"

permissions:
  contents: read
  packages: write

jobs:
  discover-profiles:
    name: "Discover Profiles"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_profiles: ${{ steps.set-matrix.outputs.has_profiles }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Scan profiles directory
        id: set-matrix
        run: |
          PROFILES=()
          FILTER="${{ github.event.inputs.profile_filter || 'all' }}"
          
          if [ -d "profiles" ]; then
            for item in profiles/*; do
              # Handles both <id>/profile.yml and <id>.yml shapes
              if [ -d "$item" ] && [ -f "$item/profile.yml" ]; then
                pname=$(basename "$item")
                if [ "$FILTER" = "all" ] || [ "$FILTER" = "$pname" ]; then
                  PROFILES+=("$pname")
                fi
              elif [ -f "$item" ] && [[ "$item" == *.yml ]]; then
                pname=$(basename "$item" .yml)
                if [ "$FILTER" = "all" ] || [ "$FILTER" = "$pname" ]; then
                  PROFILES+=("$pname")
                fi
              fi
            done
          fi

          if [ ${#PROFILES[@]} -eq 0 ]; then
            echo "has_profiles=false" >> $GITHUB_OUTPUT
            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "No profiles matching criteria found."
          else
            echo "has_profiles=true" >> $GITHUB_OUTPUT
            JSON=$(jq -nc --args '$ARGS.positional' "${PROFILES[@]}")
            echo "matrix={\"profile\":$JSON}" >> $GITHUB_OUTPUT
            echo "Discovered profiles: $JSON"
          fi

  build-and-publish:
    name: "Build: ${{ matrix.profile }}"
    needs: discover-profiles
    if: needs.discover-profiles.outputs.has_profiles == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-profiles.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download devcontainer-cli
        run: |
          CLI_REQ_VER="${{ github.event.inputs.cli_version || 'latest' }}"
          REPO="Joacohbc/my-devcontainer-installer"
          
          if [ "$CLI_REQ_VER" = "latest" ]; then
            TAG=$(curl -sSL "https://api.github.com/repos/${REPO}/releases/latest" | jq -r '.tag_name')
            if [ "$TAG" = "null" ] || [ -z "$TAG" ]; then
              TAG="v1.18.1"
            fi
          else
            TAG="$CLI_REQ_VER"
          fi
          
          echo "Downloading devcontainer-cli from release ${TAG}..."
          curl -sSL -o devcontainer-cli \
            "https://github.com/${REPO}/releases/download/${TAG}/devcontainer-cli-linux-x64"
          chmod +x devcontainer-cli
          ./devcontainer-cli --version || true

      - name: Prepare environment variables and image tags
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO_OWNER="${OWNER,,}"
          PROFILE="${{ matrix.profile }}"
          IMAGE_NAME="ghcr.io/${REPO_OWNER}/${PROFILE}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)

          echo "REPO_OWNER=${REPO_OWNER}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "TAG_LATEST=${IMAGE_NAME}:latest" >> $GITHUB_ENV
          echo "TAG_SHA=${IMAGE_NAME}:${SHORT_SHA}-${TIMESTAMP}" >> $GITHUB_ENV

      - name: Setup profile in devcontainer-cli config
        run: |
          # devcontainer-cli reads user profiles from ~/.config/devcontainer-cli/profiles/
          CONFIG_PROFILE_DIR="${HOME}/.config/devcontainer-cli/profiles"
          mkdir -p "${CONFIG_PROFILE_DIR}"
          cp -r profiles/* "${CONFIG_PROFILE_DIR}/"

      - name: Generate Dockerfile with devcontainer-cli
        run: |
          PROFILE_NAME="${{ matrix.profile }}"
          echo "Generating build context for profile: ${PROFILE_NAME}"

          ./devcontainer-cli --no-interactive --force \
            --workspace "${PROFILE_NAME}" \
            --mode custom \
            --profile "${PROFILE_NAME}" \
            --image "${{ env.TAG_LATEST }}" \
            --no-build

          if [ ! -f ".dc_${PROFILE_NAME}/build/Dockerfile" ]; then
            echo "Error: Dockerfile was not generated in .dc_${PROFILE_NAME}/build/Dockerfile"
            exit 1
          fi

      - name: Build and Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .dc_${{ matrix.profile }}/build
          file: .dc_${{ matrix.profile }}/build/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ env.TAG_LATEST }}
          cache-to: ${{ github.event_name != 'pull_request' && 'type=inline' || '' }}
          tags: |
            ${{ env.TAG_LATEST }}
            ${{ env.TAG_SHA }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Custom devcontainer image for profile ${{ matrix.profile }}
